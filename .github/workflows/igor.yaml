name: igor

on:
  pull_request:
    paths: ["igor/**", "haos/igor/**", ".github/workflows/igor.yaml"]
  push:
    branches: [master]
    paths: ["igor/**", ".github/workflows/igor.yaml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: igor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: igor/go.mod
          cache-dependency-path: igor/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: GOOS=linux GOARCH=arm GOARM=7 go build ./...

  # Every build on master is a release: YYYY.WW.PATCH with the ISO year and
  # week, PATCH counting that week's releases from 0. The git tag
  # igor-v<version> records which commit a version is.
  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    concurrency: igor-image   # two builds must not pick the same PATCH
    permissions:
      contents: write   # push the version tag
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags
      - id: version
        run: igor/hack/next-version.sh >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: igor
          platforms: linux/arm/v7,linux/arm64
          push: true
          tags: |
            ghcr.io/thaum-xyz/igor:${{ steps.version.outputs.version }}
            ghcr.io/thaum-xyz/igor:latest
          labels: |
            org.opencontainers.image.source=https://github.com/thaum-xyz/lancre
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          build-args: VERSION=${{ steps.version.outputs.version }}
      - name: Tag the commit
        run: |
          git tag "igor-v${{ steps.version.outputs.version }}"
          git push origin "igor-v${{ steps.version.outputs.version }}"
      # The HAOS app installs image:version, so its version is the tag just pushed.
      # A GITHUB_TOKEN push starts no workflow, and haos/ is outside the paths above.
      - name: Point the HAOS app at this release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/^version: \"[^\"]*\"/version: \"$VERSION\"/" haos/igor/config.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "haos/igor: $VERSION" haos/igor/config.yaml
          git pull --rebase origin master
          git push origin HEAD:master
