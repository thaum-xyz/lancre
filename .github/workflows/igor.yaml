name: igor

on:
  pull_request:
    paths: ["igor/**", ".github/workflows/igor.yaml"]
  push:
    branches: [master]
    paths: ["igor/**", ".github/workflows/igor.yaml"]
    tags: ["igor-v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: igor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: igor/go.mod
          cache-dependency-path: igor/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: GOOS=linux GOARCH=arm GOARM=7 go build ./...

  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/thaum-xyz/igor
          tags: |
            type=sha,format=short
            type=match,pattern=igor-v(.*),group=1
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: igor
          platforms: linux/arm/v7,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
