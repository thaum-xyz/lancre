---
- hosts: all
  become: true
  roles:
  - oefenweb.locales
  - jnv.unattended-upgrades
  - dev-sec.ssh-hardening
  - cloudalchemy.node-exporter
  - paulfantom.system
  - paulfantom.raspberry

- hosts: home
  become: true
  tasks:
  - name: Add dynamic DNS updater
    cron:
      name: dyndns
      cron_file: /etc/crontab
      user: 'pi'
      minute: '*/15'
      # FIXME: secure secret
      job: 'curl -fsS --user "thaum.xyz-lancre:JPbNcG3a9UyqtzSfj2rbXjteBDcd6e" "https://www.ovh.com/nic/update?system=dyndns&hostname=lancre.thaum.xyz"'
