---
- hosts: docker
  become: true
  tasks:
  - name: Create data and configuration directory
    file:
      path: "/srv/config"
      state: directory
  - name: Copy configuration files
    copy:
      src: "{{ item }}"
      dest: "/srv/config/{{ item | basename }}"
    with_fileglob:
      - "files/{{ inventory_hostname }}/*"

- hosts: docker
  become: true
  roles:
    - geerlingguy.docker_arm
  tasks:
  - name: Add docker image prune
    cron:
      name: docker prune
      cron_file: /etc/crontab
      user: root
      minute: "34"
      hour: "1"
      weekday: "5"
      job: "docker system prune --all --force"
  - name: download latest images
    docker_image:
      name: "{{ item.image }}"
      state: present
      force: true
    with_items: "{{ containers }}"
  - name: create containers
    docker_container:
      restart_policy: "unless-stopped"
      log_driver: json-file
      log_options:
        max-file: "5"
        max-size: "10m"
      image: "{{ item.image }}"
      name: "{{ item.name }}"
      network_mode: "{{ item.network_mode | default(omit) }}"
      entrypoint: "{{ item.entrypoint | default(omit) }}"
      command: "{{ item.command | default(omit) }}"
      volumes: "{{ item.volumes | default(omit) }}"
      env: "{{ item.env | default(omit) }}"
    with_items: "{{ containers }}"
