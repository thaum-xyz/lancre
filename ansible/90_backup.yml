---
- name: backups
  hosts: hmi
  become: true
  tasks:
  - name: Create backup cronjob for homeassistant
    cron:
      cron_file: /etc/crontab
      name: homeassistant-backup
      hour: 2
      minute: 13
      user: root
      job: >
        docker pull quay.io/paulfantom/restic-mysql && 
        docker run --rm -it 
        -e B2_ACCOUNT_ID="001c14f02766f430000000002" 
        -e B2_ACCOUNT_KEY="K001wIZ0wuc/YXOveKySxwYYCyCJvG0" 
        -e RESTIC_PASSWORD="xVaSBu92EtQuFHkQMC8yyu5GTWFJX3" 
        -e RESTIC_REPOSITORY="b2:hmi-lancre-thaum-xyz:/homeassistant" 
        -e DATA_DIRECTORY=/config 
        -e INSTANCE=hmi
        -e NAMESPACE=lancre
        -e PUSHGATEWAY_URL="http://garaz:9091" 
        -e MAX_AGE="691200" 
        -v /srv/homeassistant/config:/config:ro
        --name restic
        quay.io/paulfantom/restic-mysql
