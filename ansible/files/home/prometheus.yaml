global:
  evaluation_interval: 3s
  scrape_interval: 10s
  scrape_timeout: 5s

  external_labels:
    environment: lancre.thaum.xyz
    cluster: lancre

rule_files:
  - /etc/prometheus/rules.yml

remote_write:
- url: https://prometheus-us-central1.grafana.net/api/prom/push
  basic_auth:
    username: "24900"
    password: eyJrIjoiMzliZTQwZmQ5MGEwNzkzNzdlMzUxZmYzMzBhZTk0NmU2ZjBjOTg2NyIsIm4iOiJsYW5jcmUiLCJpZCI6NDU0ODQ1fQ==
  write_relabel_configs:
  - source_labels:
    - job
    regex: "node-exporter"
    action: drop
- name: ankhmorpork
  url: https://metrics.datalake.ankhmorpork.thaum.xyz/api/v1/receive
  basic_auth:
    username: stibbons
    password: 'tYLNK&8ixMM7gEXj%#2J9U'

scrape_configs:
  - job_name: prometheus
    static_configs:
    - targets:
      - localhost:9090
      labels:
        namespace: monitoring
    metric_relabel_configs:
    - source_labels: [__name__]
      regex: "prometheus_notifications_alertmanagers_discovered"
      action: drop
  - job_name: pushgateway
    static_configs:
    - targets:
      - localhost:9091
      labels:
        namespace: monitoring
  - job_name: cloudflared
    static_configs:
    - targets:
      - localhost:8099
      labels:
        namespace: tunnel
  - job_name: coredns
    static_configs:
    - targets:
      - localhost:9153
      labels:
        namespace: dns
  - job_name: node-exporter
    static_configs:
    - targets:
      - hmi:9100
      - home:9100
      - garaz:9100
      - biuro:9100
      labels:
        namespace: monitoring
    relabel_configs:
    - source_labels: [__address__]
      regex: "(.*):(.*)"
      replacement: '$1'
      target_label: node
    metric_relabel_configs:
    - source_labels: [__address__]
      regex: "(.*):(.*)"
      replacement: '$1'
      target_label: node
  - job_name: node-exporter-qnap
    static_configs:
    - targets:
      - 192.168.20.20:9100
      labels:
        namespace: monitoring
    relabel_configs:
    - source_labels: [__address__]
      regex: "(.*):(.*)"
      replacement: '$1'
      target_label: node
    metric_relabel_configs:
    - source_labels: [__address__]
      regex: "(.*):(.*)"
      replacement: '$1'
      target_label: node

  - job_name: snmp
    static_configs:
    - targets:
      - localhost:9116
      labels:
        namespace: snmp
  - job_name: qnap
    params:
      module:
      - qnap
    scrape_interval: 1m
    scrape_timeout: 1m
    metrics_path: /snmp
    static_configs:
    - targets:
      - 192.168.20.20
      labels:
        module: qnap
        namespace: snmp
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9116
  - job_name: qnaplong
    params:
      module:
      - qnaplong
    scrape_interval: 4m
    scrape_timeout: 4m
    metrics_path: /snmp
    static_configs:
    - targets:
      - 192.168.20.20
      labels:
        module: qnaplong
        namespace: snmp
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9116

  - job_name: evok
    scrape_interval: 1s
    metric_relabel_configs:
    #- regex: 28FF89DB06000034
    - regex: 28FF89DB060000
      replacement: climate-inside
      source_labels: [ 'circuit' ]
      target_label: circuit
    #- regex: 287CECBF060000DA
    - regex: 287CECBF060000
      replacement: climate-outside
      source_labels: [ 'circuit' ]
      target_label: circuit
    #- regex: 28FF5AF502150270
    - regex: 28FF5AF5021502
      replacement: heater-in
      source_labels: [ 'circuit' ]
      target_label: circuit
    #- regex: 28FF4D15151501C6
    - regex: 28FF4D15151501
      replacement: heater-out
      source_labels: [ 'circuit' ]
      target_label: circuit
    #- regex: 28FF4C30041503A7
    - regex: 28FF4C30041503
      replacement: tank
      source_labels: [ 'circuit' ]
      target_label: circuit
    #- regex: 28FF1A181515019F
    - regex: 28FF1A18151501
      replacement: solar-in
      source_labels: [ 'circuit' ]
      target_label: circuit
    #- regex: 28FF0A9171150270
    - regex: 28FF0A91711502
      replacement: solar-out
      source_labels: [ 'circuit' ]
      target_label: circuit
    #- regex: 28FF55555019012D
    - regex: 28FF5555501901
      replacement: sauna
      source_labels: [ 'circuit' ]
      target_label: circuit
    static_configs:
    - targets:
      - localhost:7979
      labels:
        namespace: heating
  - job_name: solar
    scrape_interval: 2s
    static_configs:
    - targets:
      - localhost:7000
      - localhost:7001
      labels:
        namespace: heating
  - job_name: thermostat
    scrape_interval: 2s
    static_configs:
    - targets:
      - localhost:7009
      labels:
        namespace: heating
  - job_name: circulation
    scrape_interval: 2s
    static_configs:
    - targets:
      - localhost:7003
      labels:
        namespace: heating
