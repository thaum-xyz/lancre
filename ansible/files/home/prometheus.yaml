global:
  evaluation_interval: 3s
  scrape_interval: 10s
  scrape_timeout: 5s

  external_labels:
    environment: lancre.thaum.xyz
    cluster: lancre

rule_files:
  - /etc/prometheus/rules.yml

remote_write:
- url: https://prometheus-us-central1.grafana.net/api/prom/push
  basic_auth:
    username: "24900"
    password: eyJrIjoiMzliZTQwZmQ5MGEwNzkzNzdlMzUxZmYzMzBhZTk0NmU2ZjBjOTg2NyIsIm4iOiJsYW5jcmUiLCJpZCI6NDU0ODQ1fQ==
  write_relabel_configs:
  - source_labels:
    - job
    regex: "node-exporter"
    action: drop
- name: ankhmorpork
  url: https://metrics.datalake.ankhmorpork.thaum.xyz/api/v1/receive
  basic_auth:
    username: stibbons
    password: 'tYLNK&8ixMM7gEXj%#2J9U'

scrape_configs:
  - job_name: prometheus
    static_configs:
    - targets:
      - localhost:9090
    metric_relabel_configs:
    - source_labels: [__name__]
      regex: "prometheus_notifications_alertmanagers_discovered"
      action: drop
    - source_labels: [__name__]
      target_label: namespace
      replacement: "lancre"
  - job_name: pushgateway
    static_configs:
    - targets:
      - localhost:9091
    metric_relabel_configs:
    - source_labels: [__name__]
      target_label: namespace
      replacement: "lancre"
  - job_name: coredns
    static_configs:
    - targets:
      - localhost:9153
    metric_relabel_configs:
    - source_labels: [__name__]
      target_label: namespace
      replacement: "lancre"
  - job_name: node-exporter
    static_configs:
    - targets:
      - hmi:9100
      - home:9100
      - garaz:9100
      - biuro:9100
    relabel_configs:
    - source_labels: [__address__]
      regex: "(.*):(.*)"
      replacement: '$1'
      target_label: node
    metric_relabel_configs:
    - source_labels: [__address__]
      regex: "(.*):(.*)"
      replacement: '$1'
      target_label: node
    - source_labels: [__name__]
      target_label: namespace
      replacement: "lancre"

  - job_name: evok
    scrape_interval: 1s
    metric_relabel_configs:
    #- regex: 28FF89DB06000034
    - regex: 28FF89DB060000
      replacement: climate-inside
      source_labels: [ 'circuit' ]
      target_label: circuit
    #- regex: 287CECBF060000DA
    - regex: 287CECBF060000
      replacement: climate-outside
      source_labels: [ 'circuit' ]
      target_label: circuit
    #- regex: 28FF5AF502150270
    - regex: 28FF5AF5021502
      replacement: heater-in
      source_labels: [ 'circuit' ]
      target_label: circuit
    #- regex: 28FF4D15151501C6
    - regex: 28FF4D15151501
      replacement: heater-out
      source_labels: [ 'circuit' ]
      target_label: circuit
    #- regex: 28FF4C30041503A7
    - regex: 28FF4C30041503
      replacement: tank
      source_labels: [ 'circuit' ]
      target_label: circuit
    #- regex: 28FF1A181515019F
    - regex: 28FF1A18151501
      replacement: solar-in
      source_labels: [ 'circuit' ]
      target_label: circuit
    #- regex: 28FF0A9171150270
    - regex: 28FF0A91711502
      replacement: solar-out
      source_labels: [ 'circuit' ]
      target_label: circuit
    #- regex: 28FF55555019012D
    - regex: 28FF5555501901
      replacement: sauna
      source_labels: [ 'circuit' ]
      target_label: circuit
    - source_labels: [__name__]
      target_label: namespace
      replacement: "heating"
    static_configs:
    - targets:
      - localhost:7979
  - job_name: solar
    scrape_interval: 2s
    static_configs:
    - targets:
      - localhost:7000
      - localhost:7001
    metric_relabel_configs:
    - source_labels: [__name__]
      target_label: namespace
      replacement: "heating"
  - job_name: thermostat
    scrape_interval: 2s
    static_configs:
    - targets:
      - localhost:7009
    metric_relabel_configs:
    - source_labels: [__name__]
      target_label: namespace
      replacement: "heating"
  - job_name: circulation
    scrape_interval: 2s
    static_configs:
    - targets:
      - localhost:7003
    metric_relabel_configs:
    - source_labels: [__name__]
      target_label: namespace
      replacement: "heating"
