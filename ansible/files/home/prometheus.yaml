global:
  evaluation_interval: 5s
  scrape_interval: 10s
  scrape_timeout: 5s

  external_labels:
    environment: lancre.thaum.xyz

scrape_configs:
  - job_name: prometheus
    scrape_interval: 30s
    static_configs:
    - targets:
      - localhost:9090
  - job_name: pushgateway
    scrape_interval: 30s
    static_configs:
    - targets:
      - localhost:9091
  - job_name: node
    scrape_interval: 30s
    static_configs:
    - targets:
      - hmi:9100
      - home:9100
      - garaz:9100
  - job_name: evok
    metric_relabel_configs:
    - regex: 28FF89DB06000034
      replacement: climate-inside
      source_labels: [ 'circuit' ]
      target_label: circuit
    - regex: 287CECBF060000DA
      replacement: climate-outside
      source_labels: [ 'circuit' ]
      target_label: circuit
    - regex: 28FF5AF502150270
      replacement: heater-in
      source_labels: [ 'circuit' ]
      target_label: circuit
    - regex: 28FF4D15151501C6
      replacement: heater-out
      source_labels: [ 'circuit' ]
      target_label: circuit
    - regex: 28FF4C30041503A7
      replacement: tank
      source_labels: [ 'circuit' ]
      target_label: circuit
    - regex: 28FF1A181515019F
      replacement: solar-in
      source_labels: [ 'circuit' ]
      target_label: circuit
    - regex: 28FF0A9171150270
      replacement: solar-out
      source_labels: [ 'circuit' ]
      target_label: circuit
    - regex: 28FF
      replacement: sauna
      source_labels: [ 'circuit' ]
      target_label: circuit
    static_configs:
    - targets:
      - localhost:7979
  - job_name: solar
    scrape_interval: 5s
    static_configs:
    - targets:
      - localhost:7000
      - localhost:7001
  - job_name: heater
    scrape_interval: 5s
    static_configs:
    - targets:
      - localhost:7002
  - job_name: circulation
    scrape_interval: 5s
    static_configs:
    - targets:
      - localhost:7003
