- name: evok_temperature
  type: object
  path: $.data[*]?(@.dev == "temp")
  labels:
    circuit: $.circuit
  values:
    celsius: $.value

- name: evok_relay_state
  type: object
  path: $.data[*]?(@.dev == "relay")
  labels:
    circuit: $.circuit
  values:
    boolean: $.value

- name: evok_digital_input_state
  type: object
  path: $.data[*]?(@.dev == "input")
  labels:
    circuit: $.circuit
  values:
    boolean: $.value

- name: evok_analog_input
  type: object
  path: $.data[*]?(@.dev == "ai")
  labels:
    circuit: $.circuit
  values:
    volts: $.value

- name: evok_analog_output
  type: object
  path: $.data[*]?(@.dev == "ao")
  labels:
    circuit: $.circuit
  values:
    volts: $.value
