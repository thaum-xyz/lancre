---
prometheus_web_external_url: "https://lancre.thaum.xyz"
prometheus_storage_retention: "7d"
prometheus_global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 5s
prometheus_external_labels:
  environment: lancre.thaum.xyz
prometheus_alert_rules:
  - record: solar:evok_temperature_celsius:diff
    expr: 'sum without(address,circuit) (evok_temperature_celsius{circuit="solar-out"}) - sum without(address,circuit) (evok_temperature_celsius{circuit="solar-in"})'
  - record: heater:evok_temperature_celsius:diff
    expr: 'sum without(address,circuit) (evok_temperature_celsius{circuit="heater-out"}) - sum without(address,circuit) (evok_temperature_celsius{circuit="heater-in"})'
  - record: 'solar:evok_temperature:'
    expr: 'sum without(circuit) (evok_analog_input_volts{circuit="1"}*200/12)'
  - record: solar:evok_temperature_high_celsius:diff
    expr: '(sum without(circuit) (solar:evok_temperature:) + sum without(circuit,address) (evok_temperature_celsius{circuit="solar-out"})) / 2 - sum without(circuit,address) (evok_temperature_celsius{circuit="solar-in"})'
  - record: solar:evok_temperature_low_celsius:diff
    expr: 'sum without(circuit) (solar:evok_temperature:) - sum without(circuit,address) (evok_temperature_celsius{circuit="solar-in"})'

prometheus_remote_write:
- url: https://prometheus-us-central1.grafana.net/api/prom/push
  basic_auth:
    username: 24900
    password: "eyJrIjoiMzliZTQwZmQ5MGEwNzkzNzdlMzUxZmYzMzBhZTk0NmU2ZjBjOTg2NyIsIm4iOiJsYW5jcmUiLCJpZCI6NDU0ODQ1fQ=="
  write_relabel_configs:
  - source_labels:
    - job
    action: drop

prometheus_scrape_configs:
  - job_name: prometheus
    scrape_interval: 30s
    static_configs:
      - targets:
          - garaz:9090
  - job_name: 'pushgateway'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'localhost:9091'
  - job_name: 'node'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'hmi:9100'
          - 'home:9100'
          - 'garaz:9100'
  - job_name: 'evok'
    static_configs:
      - targets:
          - 'home:7979'
    metric_relabel_configs:
      - source_labels: ['circuit']
        target_label: 'circuit'
        regex: '28FF89DB06000034'
        replacement: 'climate-inside'
      - source_labels: ['circuit']
        target_label: 'circuit'
        regex: '287CECBF060000DA'
        replacement: 'climate-outside'
      - source_labels: ['circuit']
        target_label: 'circuit'
        regex: '28FF5AF502150270'
        replacement: 'heater-in'
      - source_labels: ['circuit']
        target_label: 'circuit'
        regex: '28FF4D15151501C6'
        replacement: 'heater-out'
      - source_labels: ['circuit']
        target_label: 'circuit'
        regex: '28FF4C30041503A7'
        replacement: 'tank'
      - source_labels: ['circuit']
        target_label: 'circuit'
        regex: '28FF1A181515019F'
        replacement: 'solar-in'
      - source_labels: ['circuit']
        target_label: 'circuit'
        regex: '28FF0A9171150270'
        replacement: 'solar-out'
      - source_labels: ['circuit']
        target_label: 'circuit'
        regex: '28FF55555019012D'
        replacement: 'sauna'
