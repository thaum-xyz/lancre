---
prometheus_web_external_url: "https://lancre.thaum.xyz"
prometheus_storage_retention: "2h"
prometheus_global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 15s
prometheus_external_labels:
  environment: lancre.thaum.xyz
prometheus_alert_rules: []
prometheus_scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - garaz:9090
  - job_name: 'pushgateway'
    static_configs:
      - targets:
          - 'localhost:9091'
  - job_name: 'node'
    static_configs:
      - targets:
          - 'hmi:9100'
          - 'unipi:9100'
          - 'garaz:9100'
          # - 'controller:9100'
  - job_name: 'evok'
    scrape_interval: 10s
    static_configs:
      - targets:
          - 'unipi:7979'
