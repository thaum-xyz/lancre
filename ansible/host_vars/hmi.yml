---
unattended_automatic_reboot_time: "02:00"

rpi_gpu_mem: 128
rpi_bt: true
rpi_swap_size: 400

healthcheck_url: "<redacted>"

kiosk_url: "https://zmc.krupa.net.pl"
kiosk_delay: 10
kiosk_browser_params:
  - "--no-default-browser-check"
  - "--no-first-run"
  - "--disable-session-crashed-bubble"
  - "--disable-infobars"
  - "--kiosk"
  - "--disk-cache-dir=/dev/null"
  - "--disk-cache-size=1"
  - "--check-for-update-interval=604800"
