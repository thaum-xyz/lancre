---
locales_present:
  - en_US.UTF-8
  - en_GB.UTF-8
locales_default:
  lang: en_US.UTF-8

healthcheck_url: "https://hc-ping.com/ae7a9910-234a-4551-b8ff-1a518642ce1b"

system_earlyoom_enabled: false
rpi_swap_size: 100
rpi_config_params: |
  dtparam=i2c_arm=on
  device_tree_param=i2c1=on
  dtoverlay=i2c-rtc,mcp7941x
  dtoverlay=unipiee
  dtoverlay=neuronee
  dtparam=act_led_trigger=heartbeat
  #dtparam=pwr_led_trigger=heartbeat

# docker_version: 5:19.03.12~3-0~raspbian-stretch

containers:
  - name: prometheus
    image: quay.io/prometheus/prometheus:v2.45.0  # LTS
    network_mode: "host"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - "/srv/config/prometheus.yaml:/etc/prometheus/prometheus.yml:ro"
      - "/srv/config/prometheus-rules.yaml:/etc/prometheus/rules.yml:ro"
      - "/srv/prometheus:/prometheus"
  - name: snmp
    network_mode: "host"
    image: quay.io/prometheus/snmp-exporter:v0.21.0
    privileged: true
    volumes:
      - "/srv/config/snmp.yaml:/etc/snmp_exporter/snmp.yaml"
    command: --config.file=/etc/snmp_exporter/snmp.yaml
  - name: pushgateway
    network_mode: "host"
    image: quay.io/prometheus/pushgateway:v1.5.0
  - name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:2023.11.2
    network_mode: "host"
    privileged: true
    volumes:
      - "/srv/homeassistant/config:/config"
      - "/srv/homeassistant/db:/db"
    env:
      TZ: Europe/Warsaw
  - name: evok-exporter
    image: quay.io/prometheuscommunity/json-exporter:v0.1.0
    network_mode: host # exposed on port 7979
    command:
      - "http://localhost:8080/json/all"
      - "/config.yaml"
    volumes:
      - /srv/config/evok-exporter.yaml:/config.yaml:ro

  # SENSORS
  - name: flow-meter
    image: automatedhome/flow-meter:0.1.2
    network_mode: host
    command:
      - "--evok-circuit=6"
      - "--liters-per-rotation=0.1"
    volumes:
      - /etc/localtime:/etc/localtime:ro

  # CONTROLLERS
  - name: solar
    image: automatedhome/solar:0.8.4
    network_mode: host
    command:
    - "--homeassistant-token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJmODRhOWU4MWE5YWM0ZjI2OGVmMGYwOTAwYjBiOTQ3YSIsImlhdCI6MTY4ODcxMjk4NiwiZXhwIjoyMDA0MDcyOTg2fQ.ZIRfpVaOZw1AqMSyFrJiYhdCeYzymLBjCEUF3OO1rts"
    #- "--invert"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /srv/config/solar.yaml:/config.yaml:ro
  - name: circulation
    image: automatedhome/circulation:latest
    network_mode: host
    command:
      - "--evok-api-address=localhost:8080"
      - "--evok-circuit=5"
      - "--evok-relay=4"
      - "--duration=12"
      - "--interval=60"
    volumes:
      - /etc/localtime:/etc/localtime:ro
