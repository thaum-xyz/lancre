---
locales_present:
  - en_US.UTF-8
  - en_GB.UTF-8
locales_default:
  lang: en_US.UTF-8

healthcheck_url: "https://hc-ping.com/ae7a9910-234a-4551-b8ff-1a518642ce1b"

system_earlyoom_enabled: false
rpi_swap_size: 100
rpi_config_params: |
  dtparam=i2c_arm=on
  device_tree_param=i2c1=on
  dtoverlay=i2c-rtc,mcp7941x
  dtoverlay=unipiee
  dtoverlay=neuronee
  dtparam=act_led_trigger=heartbeat
  #dtparam=pwr_led_trigger=heartbeat

# docker_version: 5:19.03.12~3-0~raspbian-stretch

containers:
  - name: prometheus
    image: quay.io/prometheus/prometheus:v2.20.1
    network_mode: "host"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - "/srv/config/prometheus.yaml:/etc/prometheus/prometheus.yml:ro"
      - "/srv/config/prometheus-rules.yaml:/etc/prometheus/rules.yml:ro"
      - "/srv/prometheus:/prometheus"
  - name: pushgateway
    network_mode: "host"
    image: quay.io/prometheus/pushgateway:v1.2.0
  - name: homeassistant
    image: homeassistant/raspberrypi3-homeassistant:0.113.3
    network_mode: "host"
    volumes:
      - "/srv/homeassistant/config:/config"
      - "/srv/homeassistant/db:/db"
    env:
      TZ: Europe/Warsaw
  - name: caddy
    image: hectormolinero/caddy
    network_mode: "host"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /srv/config/Caddyfile:/etc/caddy/Caddyfile:ro
  - name: adblocker
    image: quay.io/paulfantom/coredns-ads
    network_mode: host
    command:
      - '-conf=/etc/coredns/Corefile'
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /srv/config/Corefile:/etc/coredns/Corefile:ro
  - name: mosquitto
    image: eclipse-mosquitto:1.6
    network_mode: host
    volumes:
      - /srv/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - /srv/mosquitto:/mosquitto/data
      - /etc/localtime:/etc/localtime:ro
  - name: mqtt-logger
    image: eclipse-mosquitto:1.6
    network_mode: host
    entrypoint: "/usr/bin/mosquitto_sub"
    command: '-h localhost -F "%I: %t: %p" -t #'
    volumes:
      - /etc/localtime:/etc/localtime:ro
  - name: bridge
    # image: automatedhome/evok-mqtt-bridge:0.0.2
    image: automatedhome/evok-mqtt-bridge:latest
    network_mode: host
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /srv/config/bridge.yaml:/config.yaml:ro
  - name: evok-exporter
    image: quay.io/prometheuscommunity/json-exporter:v0.1.0
    network_mode: host # exposed on port 7979
    command:
      - "http://localhost:8080/json/all"
      - "/config.yaml"
    volumes:
      - /srv/config/json-exporter.yaml:/config.yaml:ro

  # SENSORS
  - name: flow-meter
    # image: automatedhome/flow-meter:0.0.2
    image: automatedhome/flow-meter:latest  # including basic prometheus metrics
    network_mode: host
    command:
      - "-outTopic"
      - "solar/flow/rate"
      - "-litersPerRotation"
      - "0.1"
    volumes:
      - /etc/localtime:/etc/localtime:ro
  - name: analog-in
    image: automatedhome/analog-temperature:0.0.1  # not needed after switching to prom
    network_mode: host
    volumes:
      - /etc/localtime:/etc/localtime:ro
  - name: thermostat
    image: automatedhome/thermostat:0.0.3
    network_mode: host
    command: ["-clientid", "thermostat"]
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /srv/config/thermostat.yaml:/config.yaml:ro

  # CONTROLLERS
  - name: scheduler
    image: automatedhome/scheduler:0.0.3
    network_mode: host
    command:
      - "-topic=thermostat/schedule"
      - "-token=VdBTUAakzktLzsYz8nas9JT3hRg8Y7"
    volumes:
      - /etc/localtime:/etc/localtime:ro
  - name: solar
    # image: automatedhome/solar:0.0.3
    image: automatedhome/solar:latest  # added prometheus metrics
    network_mode: host
    # command:
    #   - "--invert"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /srv/config/solar.yaml:/config.yaml:ro
  - name: heater
    # image: automatedhome/heater:0.0.2
    image: automatedhome/heater:latest  # added prometheus metrics
    network_mode: host
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /srv/config/heater.yaml:/config.yaml:ro
  - name: circulation
    # image: automatedhome/circulation:0.0.1
    image: automatedhome/circulation:latest  # added prometheus metrics
    network_mode: host
    command: ["-inTopic", "evok/input/5/value", "-outTopic", "evok/relay/4/set"]
    volumes:
      - /etc/localtime:/etc/localtime:ro
