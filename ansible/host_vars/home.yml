---
locales_present:
  - en_US.UTF-8
  - en_GB.UTF-8
locales_default:
  lang: en_US.UTF-8

healthcheck_url: "https://hc-ping.com/ae7a9910-234a-4551-b8ff-1a518642ce1b"

system_earlyoom_enabled: false
rpi_swap_size: 100
rpi_config_params: |
  dtparam=i2c_arm=on
  device_tree_param=i2c1=on
  dtoverlay=i2c-rtc,mcp7941x
  dtoverlay=unipiee
  dtoverlay=neuronee
  dtparam=act_led_trigger=heartbeat
  #dtparam=pwr_led_trigger=heartbeat

# docker_version: 5:19.03.12~3-0~raspbian-stretch

containers:
  - name: prometheus
    # image: quay.io/prometheus/prometheus:v2.37.3  # LTS
    image: quay.io/prometheus/prometheus:v2.28.0
    network_mode: "host"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - "/srv/config/prometheus.yaml:/etc/prometheus/prometheus.yml:ro"
      - "/srv/config/prometheus-rules.yaml:/etc/prometheus/rules.yml:ro"
      - "/srv/prometheus:/prometheus"
  - name: pushgateway
    network_mode: "host"
    image: quay.io/prometheus/pushgateway:v1.2.0
  - name: homeassistant
    image: homeassistant/raspberrypi3-homeassistant:2021.8.5
    network_mode: "host"
    privileged: true
    volumes:
      - "/srv/homeassistant/config:/config"
      - "/srv/homeassistant/db:/db"
    env:
      TZ: Europe/Warsaw
  - name: caddy
    image: hectormolinero/caddy
    network_mode: "host"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /srv/config/Caddyfile:/etc/caddy/Caddyfile:ro
  #- name: adblocker
    #image: quay.io/paulfantom/coredns-ads
    #network_mode: host
    #command:
      #- '-conf=/etc/coredns/Corefile'
    #volumes:
      #- /etc/localtime:/etc/localtime:ro
      #- /srv/config/Corefile:/etc/coredns/Corefile:ro
  - name: mosquitto  # TODO: remove after
    image: eclipse-mosquitto:1.6
    network_mode: host
    volumes:
      - /srv/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - /srv/mosquitto:/mosquitto/data
      - /etc/localtime:/etc/localtime:ro
  - name: mqtt-logger
    image: eclipse-mosquitto:1.6
    network_mode: host
    entrypoint: "/usr/bin/mosquitto_sub"
    command: '-h localhost -F "%I: %t: %p" -t #'
    volumes:
      - /etc/localtime:/etc/localtime:ro
  - name: bridge
    # image: automatedhome/evok-mqtt-bridge:0.0.2
    image: automatedhome/evok-mqtt-bridge:latest
    network_mode: host
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /srv/config/bridge.yaml:/config.yaml:ro
  - name: evok-exporter
    image: quay.io/prometheuscommunity/json-exporter:v0.1.0
    network_mode: host # exposed on port 7979
    command:
      - "http://localhost:8080/json/all"
      - "/config.yaml"
    volumes:
      - /srv/config/evok-exporter.yaml:/config.yaml:ro

  # SENSORS
  - name: flow-meter
    # image: automatedhome/flow-meter:0.0.2
    image: automatedhome/flow-meter:latest
    network_mode: host
    command:
      - "--evok-address=ws://localhost:8080/ws"
      - "--evok-circuit=6"
      - "--liters-per-rotation=0.1"
    volumes:
      - /etc/localtime:/etc/localtime:ro
  - name: analog-in
    image: automatedhome/analog-temperature:0.0.1  # not needed after switching to prom
    network_mode: host
    volumes:
      - /etc/localtime:/etc/localtime:ro

  # CONTROLLERS
  - name: thermostat
    image: automatedhome/scheduler:old
    network_mode: host
    command:
      - "-template=/usr/share/site.tmpl"
      - "-token=VdBTUAakzktLzsYz8nas9JT3hRg8Y7"
      - "-config=/config.yaml"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /srv/config/schedule.yaml:/config.yaml:ro
  - name: solar
    # image: automatedhome/solar:0.0.3
    image: automatedhome/solar:latest  # added prometheus metrics
    network_mode: host
    # command:
    #   - "--invert"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /srv/config/solar.yaml:/config.yaml:ro
  - name: circulation
    image: automatedhome/circulation:latest
    network_mode: host
    command:
      - "--evok-api-address=localhost:8080"
      - "--evok-circuit=5"
      - "--evok-relay=4"
      - "--duration=12"
      - "--interval=60"
    volumes:
      - /etc/localtime:/etc/localtime:ro
