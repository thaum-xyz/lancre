# HAOS app for igor: the published image, configured through options that
# Supervisor writes to /data/options.json, which igor reads as its config file.
# Keys are explained in igor/igor.example.yaml.
name: igor
slug: igor
description: UniPi 1.1 relays, inputs and 1-Wire probes over MQTT
url: https://github.com/thaum-xyz/lancre/tree/master/igor
version: "2026.47.1" # = image tag; CI sets it on every igor release
image: ghcr.io/thaum-xyz/igor
arch: [aarch64]
stage: experimental
startup: services # before Home Assistant Core, after the Mosquitto app
services: ["mqtt:need"] # broker address and user come from the Mosquitto app
devices: [/dev/i2c-1, /dev/gpiochip0]
environment:
  IGOR_CONFIG: /data/options.json
ports:
  9101/tcp: 9101
ports_description:
  9101/tcp: /metrics and /healthz (ankhmorpork Prometheus)

# The config on `home` after Evok's retirement. Quote "on"/"off": Supervisor
# reads this file as YAML 1.1.
options:
  mode: active
  mqtt: {client_id: igor, topic_prefix: igor, discovery_prefix: homeassistant}
  silent: {heartbeat_timeout: 10m, grace: 2m}
  relays:
    defaults: {on_silent: hold, max_on: "0", off_on_start: false}
    "1": {on_silent: "off"} # boiler valve
    "2": {}
    "3": {}
    "4": {max_on: 2m} # circulation pump
    "5": {}
    "6": {on_silent: "off", max_on: 3h, off_on_start: true} # sauna IR
    "7": {on_silent: "off", max_on: 3h, off_on_start: true} # sauna Finnish
    "8": {}
  digital_inputs: {debounce: 50ms, invert: []}
  analog_inputs:
    interval: 10s
    "1": {correction: 5.549713} # board EEPROM 0xF0, read 2026-11-15
    "2": {correction: 5.551579}
  analog_outputs: {enabled: false} # PWM on HAOS is untested
  onewire: {interval: 30s}

schema:
  mode: list(observe|active)
  mqtt: {client_id: str, topic_prefix: str, discovery_prefix: str}
  silent:
    heartbeat_timeout: &duration match(^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$)
    grace: *duration
  relays:
    defaults: &rule
      on_silent: list(hold|off|on)?
      max_on: match(^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$)?
      off_on_start: bool?
    "1": *rule
    "2": *rule
    "3": *rule
    "4": *rule
    "5": *rule
    "6": *rule
    "7": *rule
    "8": *rule
  digital_inputs:
    debounce: *duration
    invert: [int(1,12)]
  analog_inputs:
    enabled: bool?
    interval: *duration
    "1": {correction: "float(0,)"}
    "2": {correction: "float(0,)"}
  analog_outputs: {enabled: bool}
  onewire:
    enabled: bool?
    interval: *duration
