# igor configuration for the UniPi 1.1 at lancre. Every key is optional;
# the values shown for mqtt, http, silent, digital_inputs.debounce and the
# intervals are the defaults.

mode: observe             # observe: read and publish only. active: also obey commands and run failsafes.
board: unipi1.1           # fake: no hardware, for trying igor on a laptop

mqtt:
  url: tcp://127.0.0.1:1883
  username: igor
  password_file: ""       # or set IGOR_MQTT_PASSWORD
  client_id: igor
  topic_prefix: igor
  discovery_prefix: homeassistant

http:
  listen: ":9101"         # /metrics and /healthz

silent:
  heartbeat_timeout: 10m  # no heartbeat on igor/ha/heartbeat for this long
  grace: 2m               # broker gone or HA reported offline for this long

# Failsafes per relay (lancre#7). on_silent: hold | "off". max_on: longest
# continuous on-time, 0 = unlimited; after a trip "on" is refused until an "off".
relays:
  defaults: {on_silent: hold, max_on: 0, off_on_start: false}
  1: {on_silent: "off"}                                    # boiler valve
  4: {max_on: 2m}                                          # circulation pump
  6: {on_silent: "off", max_on: 3h, off_on_start: true}    # sauna IR
  7: {on_silent: "off", max_on: 3h, off_on_start: true}    # sauna Finnish

digital_inputs:
  debounce: 50ms
  invert: []              # DI numbers that read backwards

analog_inputs:
  # enabled: true         # default: true in active, false in observe (Evok owns the MCP3422)
  interval: 10s
  correction: {1: 5.549713, 2: 5.551579}   # board EEPROM 0xF0, read 2026-11-15

onewire:
  # enabled: true         # default: true in active, false in observe (Evok owns the DS2482)
  interval: 30s
